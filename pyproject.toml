[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubs-recurrence"
version = "0.1.0"
description = "Reproducible research into next recurring merchant family prediction"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas>=2.2", "scipy", "scikit-learn", "pyarrow", "catboost", "lightgbm", "xgboost", "joblib"]

[project.scripts]
ubs-recurrence = "ubs_recurrence.cli:main"

[project.optional-dependencies]
dev = ["pytest", "beautifulsoup4", "matplotlib", "psutil", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".codex", ".pre-commit-cache*", ".runtime314", "pytest-cache-files-javier-stream", "outputs", "data", "*tmp*", "test-temp-none-gate"]
