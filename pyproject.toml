[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-activity-forecasting"
version = "0.1.0"
description = "Base reproducible para forecasting de actividad transaccional"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<2.4", "pandas>=2.1,<3", "polars>=0.20,<2", "pyarrow>=14,<22",
    "scipy>=1.11,<2", "statsmodels>=0.14,<1", "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2", "tqdm>=4.66,<5", "matplotlib>=3.8,<4",
    "plotly>=5.18,<7", "scikit-learn>=1.4,<2", "catboost>=1.2,<2",
    "lightgbm>=4.1,<5", "xgboost>=2.0,<4", "optuna>=3.5,<5",
    "shap>=0.44,<1", "rapidfuzz>=3.5,<4",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = [
    "jupyter>=1.0,<2", "jupyterlab>=4.0,<5", "ipykernel>=6.27,<8",
    "pre-commit>=3.6,<5", "pytest>=8.0,<9", "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1", "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".venv",
    ".pre-commit-cache",
    ".pytest_cache",
    ".pytest_tmp",
    ".pytest_review_tmp",
    ".ruff_cache",
    "pytest-cache-files-*",
    "review_pytest_tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["transaction_forecasting"]
mypy_path = ["src"]
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
