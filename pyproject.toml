[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubs-recurrence"
version = "0.1.0"
description = "Reproducible research into next recurring merchant family prediction"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "pyarrow>=14,<22",
    "catboost>=1.2,<2",
    "lightgbm>=4.1,<5",
    "xgboost>=2,<4",
    "joblib>=1.3,<2",
]

[project.scripts]
ubs-recurrence = "ubs_recurrence.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "beautifulsoup4>=4.13,<5",
    "matplotlib>=3.8,<4",
    "pre-commit>=4,<5",
    "psutil>=7,<8",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    ".codex",
    ".pre-commit-cache*",
    ".runtime314",
    ".venv*",
    ".pytest_cache",
    ".pytest_tmp",
    ".ruff_cache",
    "pytest-cache-files-*",
    "outputs",
    "data",
    "*tmp*",
    "test-temp-none-gate",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
